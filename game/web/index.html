<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <div class="logo-clearspace">
      <img class="logo" src="assets/logo-mathaf.svg" alt="Mathaf">
    </div>

    <section id="lang" class="screen active">
      <div class="choices">
        <button class="choice c0" data-lang="en">English</button>
        <button class="choice c1" data-lang="ar">العربية</button>
      </div>
    </section>

    <section id="cats" class="screen">
      <h1 class="title" id="cats-title"></h1>
      <div class="choices" id="cat-list"></div>
    </section>

    <section id="play" class="screen">
      <div class="bar"><span class="eyebrow" id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div>
      <h2 id="q-text"></h2>
      <div class="pic" id="pic"></div>
      <div class="answers" id="answers"></div>
    </section>

    <section id="end" class="screen">
      <div class="end-main">
        <span class="eyebrow" id="end-label"></span>
        <div id="score"></div>
        <p class="lead" id="verdict"></p>
        <button class="btn" id="again"></button>
      </div>
      <!-- RFID card box; data-state is waiting, saved or expired -->
      <div class="scan" id="scan" data-state="waiting">
        <div class="scan-icon"></div>
        <h3 id="scan-title"></h3>
        <p id="scan-text"></p>
        <div class="scan-compare" id="scan-compare" hidden>
          <div><small id="before-label"></small><span id="before-score"></span></div>
          <div><small id="now-label"></small><span id="now-score"></span></div>
        </div>
        <div class="track scan-track"><div class="fill" id="scan-fill"></div></div>
        <button class="btn" id="skip"></button>
      </div>
    </section>
  </main>
  <script src="js/question_bank.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
