<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <div id="language-control" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-lang="ar" aria-pressed="false">عربي</button>
    </div>
    <div class="logo-clearspace">
      <img class="logo" src="assets/logo-mathaf.svg" alt="Mathaf">
    </div>

    <section id="home" class="screen active">
      <img id="home-art" class="home-art" alt="">
      <button class="btn home-play" id="home-play" type="button"></button>
    </section>

    <section id="account" class="screen">
      <div class="account-panel">
        <h1 class="title" id="account-title"></h1>
        <p id="account-prompt"></p>
        <div class="account-choice" id="account-choice">
          <button class="choice c0" id="account-signin" type="button"></button>
          <button class="choice c1" id="account-guest" type="button"></button>
        </div>
        <form id="account-form" hidden>
          <label for="account-code-input" id="account-code-label"></label>
          <input id="account-code-input" name="account-code" type="text"
                 maxlength="128" autocomplete="off" autocapitalize="off"
                 spellcheck="false">
          <button class="btn" id="account-submit" type="submit"></button>
        </form>
        <button class="btn" id="account-create-open" type="button" hidden></button>
        <form id="account-create-form" hidden>
          <label for="account-name-input" id="account-name-label"></label>
          <input id="account-name-input" name="display-name" type="text"
                 maxlength="40" autocomplete="name">
          <button class="btn" id="account-create-submit" type="submit"></button>
          <button class="btn account-create-back" id="account-create-back" type="button"></button>
        </form>
        <div id="account-created" hidden>
          <p id="account-created-message"></p>
          <strong id="account-created-code" dir="ltr"></strong>
          <p id="account-created-reminder"></p>
          <button class="btn" id="account-created-continue" type="button"></button>
        </div>
        <p id="account-error" role="status" aria-live="polite"></p>
        <p id="account-countdown" role="status" aria-live="polite"></p>
        <button class="btn account-back" id="account-back" type="button" hidden></button>
      </div>
    </section>

    <section id="cats" class="screen">
      <h1 class="title" id="cats-title"></h1>
      <div class="category-actions">
        <div class="choices" id="cat-list"></div>
        <button class="btn leaderboard-open" id="leaderboard-open"></button>
        <button class="btn dashboard-open" id="dashboard-open" hidden></button>
      </div>
      <button class="btn category-exit" id="category-exit" type="button"></button>
    </section>

    <section id="dashboard" class="screen">
      <h1 class="title" id="dashboard-title"></h1>
      <p class="dashboard-admin-name" id="dashboard-admin-name"></p>
      <div class="dashboard-stats">
        <div><span id="stat-feedback-label"></span><strong id="stat-feedback"></strong></div>
        <div><span id="stat-players-label"></span><strong id="stat-players"></strong></div>
        <div><span id="stat-today-label"></span><strong id="stat-today"></strong></div>
        <button class="dashboard-stat-detail" id="score-detail-open" type="button">
          <span id="stat-score-label"></span><strong id="stat-score"></strong>
          <small class="dashboard-detail-hint"></small>
        </button>
        <button class="dashboard-stat-detail" id="rating-detail-open" type="button">
          <span id="stat-rating-label"></span><strong id="stat-rating"></strong>
          <small class="dashboard-detail-hint"></small>
        </button>
      </div>
      <div class="dashboard-actions">
        <button class="btn" id="dashboard-back" type="button"></button>
        <button class="btn" id="dashboard-exit" type="button"></button>
      </div>
      <p class="dashboard-status" id="dashboard-status" role="status" aria-live="polite"></p>
    </section>

    <section id="dashboard-detail" class="screen">
      <h1 class="title" id="dashboard-detail-title"></h1>
      <p class="dashboard-detail-description" id="dashboard-detail-description"></p>
      <p id="dashboard-detail-status" role="status" aria-live="polite"></p>
      <div class="dashboard-detail-table-wrap" id="dashboard-detail-table-wrap" hidden>
        <table class="dashboard-detail-table">
          <thead id="dashboard-detail-head"></thead>
          <tbody id="dashboard-detail-body"></tbody>
        </table>
      </div>
      <div class="dashboard-detail-actions">
        <button class="btn" id="dashboard-detail-back" type="button"></button>
        <button class="btn" id="dashboard-detail-retry" type="button" hidden></button>
      </div>
    </section>

    <section id="leaderboard" class="screen">
      <h1 class="title" id="leaderboard-title"></h1>
      <div class="leaderboard-categories" id="leaderboard-categories"></div>
      <p class="leaderboard-status" id="leaderboard-status" role="status" aria-live="polite"></p>
      <button class="btn leaderboard-retry" id="leaderboard-retry" hidden></button>
      <div class="leaderboard-results" id="leaderboard-results">
        <div class="leaderboard-podium" id="leaderboard-podium"></div>
        <div class="leaderboard-table-wrap">
          <div class="leaderboard-table-header" aria-hidden="true">
            <span id="leaderboard-place-heading"></span>
            <span id="leaderboard-user-heading"></span>
            <span id="leaderboard-points-heading"></span>
          </div>
          <ol class="leaderboard-list" id="leaderboard-list"></ol>
        </div>
      </div>
      <div class="leaderboard-footer">
        <button class="btn" id="leaderboard-back"></button>
        <div class="leaderboard-periods" id="leaderboard-periods"></div>
      </div>
    </section>

    <section id="play" class="screen">
      <div class="bar"><span class="eyebrow" id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div>
      <h2 id="q-text"></h2>
      <div class="pic" id="pic"></div>
      <div class="answers" id="answers"></div>
    </section>

    <section id="end" class="screen">
      <div class="end-main">
        <span class="eyebrow" id="end-label"></span>
        <div id="score"></div>
        <p class="lead" id="verdict"></p>
        <div class="end-actions">
          <button class="btn" id="again"></button>
          <div class="end-account" id="end-account" hidden>
            <span><small id="end-user-label"></small><strong id="end-user"></strong></span>
            <span><small id="end-code-label"></small><strong id="end-code" dir="ltr"></strong></span>
          </div>
        </div>
      </div>
      <div class="save-panel" id="save-panel" data-state="waiting">
        <h3 id="save-title"></h3>
        <p id="save-message" role="status" aria-live="polite"></p>
        <div class="score-compare" id="score-compare" hidden>
          <div><small id="before-label"></small><span id="before-score"></span></div>
          <div><small id="now-label"></small><span id="now-score"></span></div>
        </div>
        <p class="points-earned" id="points-earned" hidden></p>
        <p class="daily-average" id="daily-average" hidden></p>
        <button class="btn" id="check-points" hidden></button>
      </div>
    </section>

    <section id="points" class="screen">
      <div class="points-page">
        <span class="eyebrow" id="points-title"></span>
        <div class="points-total" id="points-total"></div>
        <h2 class="points-history-title" id="history-title"></h2>
        <ol class="points-history" id="points-history"></ol>
        <button class="btn" id="points-back"></button>
      </div>
    </section>

    <div id="rating-modal" class="rating-backdrop" role="dialog" aria-modal="true"
         aria-labelledby="rating-title" hidden>
      <div class="rating-card">
        <button class="rating-close" id="rating-close" aria-label="Close">&times;</button>
        <h2 id="rating-title"></h2>
        <div class="rating-options" id="rating-options"></div>
        <p id="rating-status" role="status" aria-live="polite"></p>
        <div class="rating-actions">
          <button class="btn" id="rating-submit" disabled></button>
          <button class="rating-skip" id="rating-skip"></button>
        </div>
      </div>
    </div>
    <div id="visitor-stats" hidden></div>
  </main>
  <script src="js/question_bank.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
