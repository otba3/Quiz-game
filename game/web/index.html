<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <div class="logo-clearspace">
      <img class="logo" src="assets/logo-mathaf.svg" alt="Mathaf">
    </div>

    <section id="lang" class="screen active">
      <div class="choices">
        <button class="choice c0" data-lang="en">English</button>
        <button class="choice c1" data-lang="ar">العربية</button>
      </div>
    </section>

    <section id="account" class="screen">
      <div class="account-panel">
        <h1 class="title" id="account-title"></h1>
        <p id="account-prompt"></p>
        <form id="account-form">
          <label for="account-code-input" id="account-code-label"></label>
          <input id="account-code-input" name="account-code" type="text"
                 maxlength="128" autocomplete="off" autocapitalize="off"
                 spellcheck="false">
          <p id="account-error" role="status" aria-live="polite"></p>
          <button class="btn" id="account-submit" type="submit"></button>
        </form>
        <p id="account-countdown" role="status" aria-live="polite"></p>
        <button class="btn account-guest" id="account-guest" type="button"></button>
      </div>
    </section>

    <section id="cats" class="screen">
      <h1 class="title" id="cats-title"></h1>
      <div class="category-actions">
        <div class="choices" id="cat-list"></div>
        <button class="btn leaderboard-open" id="leaderboard-open"></button>
      </div>
    </section>

    <section id="leaderboard" class="screen">
      <h1 class="title" id="leaderboard-title"></h1>
      <div class="leaderboard-categories" id="leaderboard-categories"></div>
      <p class="leaderboard-status" id="leaderboard-status" role="status" aria-live="polite"></p>
      <button class="btn leaderboard-retry" id="leaderboard-retry" hidden></button>
      <div class="leaderboard-results" id="leaderboard-results">
        <div class="leaderboard-podium" id="leaderboard-podium"></div>
        <div class="leaderboard-table-wrap">
          <div class="leaderboard-table-header" aria-hidden="true">
            <span id="leaderboard-place-heading"></span>
            <span id="leaderboard-user-heading"></span>
            <span id="leaderboard-points-heading"></span>
          </div>
          <ol class="leaderboard-list" id="leaderboard-list"></ol>
        </div>
      </div>
      <div class="leaderboard-footer">
        <button class="btn" id="leaderboard-back"></button>
        <div class="leaderboard-periods" id="leaderboard-periods"></div>
      </div>
    </section>

    <section id="play" class="screen">
      <div class="bar"><span class="eyebrow" id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div>
      <h2 id="q-text"></h2>
      <div class="pic" id="pic"></div>
      <div class="answers" id="answers"></div>
    </section>

    <section id="end" class="screen">
      <div class="end-main">
        <span class="eyebrow" id="end-label"></span>
        <div id="score"></div>
        <p class="lead" id="verdict"></p>
        <button class="btn" id="again"></button>
      </div>
      <div class="save-panel" id="save-panel" data-state="waiting">
        <h3 id="save-title"></h3>
        <p id="save-message" role="status" aria-live="polite"></p>
        <div class="score-compare" id="score-compare" hidden>
          <div><small id="before-label"></small><span id="before-score"></span></div>
          <div><small id="now-label"></small><span id="now-score"></span></div>
        </div>
        <p class="points-earned" id="points-earned" hidden></p>
        <button class="btn" id="check-points" hidden></button>
      </div>
    </section>

    <section id="points" class="screen">
      <div class="points-page">
        <span class="eyebrow" id="points-title"></span>
        <div class="points-total" id="points-total"></div>
        <p class="points-target" id="points-target"></p>
        <div class="track points-track" role="progressbar" aria-valuemin="0" aria-valuemax="40">
          <div class="fill" id="points-fill"></div>
        </div>
        <h2 class="points-history-title" id="history-title"></h2>
        <ol class="points-history" id="points-history"></ol>
        <button class="btn" id="points-back"></button>
      </div>
    </section>

    <div id="rating-modal" class="rating-backdrop" role="dialog" aria-modal="true"
         aria-labelledby="rating-title" hidden>
      <div class="rating-card">
        <button class="rating-close" id="rating-close" aria-label="Close">&times;</button>
        <h2 id="rating-title"></h2>
        <div class="rating-options" id="rating-options"></div>
        <p id="rating-status" role="status" aria-live="polite"></p>
        <div class="rating-actions">
          <button class="btn" id="rating-submit" disabled></button>
          <button class="rating-skip" id="rating-skip"></button>
        </div>
      </div>
    </div>
  </main>
  <script src="js/question_bank.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
