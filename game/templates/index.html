<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>Museum Q&A</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='touchscreen.css') }}"
    >
</head>

<body>

<main>

    <!-- Language selection -->

    <section id="language-screen" class="screen active">
        <h1>Museum Q&A</h1>
        <p>Choose your language</p>

        <button type="button" onclick="chooseLanguage('en')">
            English
        </button>

        <button type="button" onclick="chooseLanguage('ar')">
            العربية
        </button>
    </section>


    <!-- Category selection -->

    <section id="category-screen" class="screen">
        <h1 id="category-heading">
            Choose a category
        </h1>

        <button type="button" onclick="startGame('title')">
            <span
                data-en="Guess the title"
                data-ar="خمن العنوان"
            >
                Guess the title
            </span>
        </button>

        <button type="button" onclick="startGame('year')">
            <span
                data-en="Guess the year"
                data-ar="خمن السنة"
            >
                Guess the year
            </span>
        </button>

        <button type="button" onclick="startGame('medium')">
            <span
                data-en="Guess the medium"
                data-ar="خمن الخامة"
            >
                Guess the medium
            </span>
        </button>

        <button type="button" onclick="startGame('origin')">
            <span
                data-en="Guess the origin"
                data-ar="خمن بلد المنشأ"
            >
                Guess the origin
            </span>
        </button>
    </section>


    <!-- Question screen -->

    <section id="question-screen" class="screen">

        <header>
            <span id="question-progress"></span>
            <span id="score-display"></span>
        </header>

        <img
            id="artwork-image"
            src=""
            alt="Museum artwork"
        >

        <h2 id="question-text"></h2>

        <div id="answer-container"></div>

        <p id="feedback"></p>

        <p id="context-text" hidden></p>

        <button
            id="hint-button"
            type="button"
            onclick="showHint()"
        >
            Hint
        </button>

        <p id="hint-text" hidden></p>

        <button
            id="next-button"
            type="button"
            onclick="nextQuestion()"
            hidden
        >
            Next
        </button>

    </section>


    <!-- Results screen -->

    <section id="result-screen" class="screen">
        <h1 id="result-heading">
            Game completed!
        </h1>

        <p id="final-score"></p>

        <button
            id="play-again-button"
            type="button"
            onclick="returnToCategories()"
        >
            Play again
        </button>
    </section>

</main>

<script src="{{ url_for('static', filename='game.js') }}"></script>

</body>
</html>
